name: Comparator

# STUB. No Paper A result has a proved Lean statement yet, so there is nothing to
# restate. Once one exists, add lean/Audit/Challenge.lean (Mathlib-only restatement,
# proof `sorry`), lean/Audit/Solution.lean (the same declarations, proved from the
# library) and lean/comparator.json as described in lean/Audit/README.md. Until then
# this workflow only reports that the configuration is absent. Add push and
# pull_request triggers when the first challenge lands.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator:
    name: Comparator (lean/Audit challenge vs solution)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: lean
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Is there a challenge to judge?
        id: config
        run: |
          if [[ -f comparator.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Comparator stub::lean/comparator.json does not exist yet; no headline theorem has been restated. See lean/Audit/README.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free runner disk space
        if: steps.config.outputs.present == 'true'
        working-directory: .
        run: |
          set -Eeuo pipefail
          # Only remove preinstalled, unused SDKs on disposable hosted runners.
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force > /dev/null || true
          fi
          df -h .
          available_kib="$(df -Pk . | awk 'NR==2 {print $4}')"
          test "$available_kib" -ge 20971520

      - name: Install elan
        if: steps.config.outputs.present == 'true'
        run: |
          set -Eeuo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install bubblewrap for lake comparator's sandbox
        if: steps.config.outputs.present == 'true'
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Restore Mathlib cache archive
        if: steps.config.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/mathlib
          key: comparator-mathlib-${{ runner.os }}-${{ hashFiles('lean/lake-manifest.json', 'lean/lean-toolchain') }}
          restore-keys: |
            comparator-mathlib-${{ runner.os }}-
            build-mathlib-${{ runner.os }}-

      - name: Fetch dependencies and build
        if: steps.config.outputs.present == 'true'
        run: |
          lake exe cache get
          lake build

      - name: Run lake comparator (Lean kernel plus the external kernels in comparator.json)
        if: steps.config.outputs.present == 'true'
        run: PATH="$(lean --print-prefix)/bin:$PATH" lake comparator
